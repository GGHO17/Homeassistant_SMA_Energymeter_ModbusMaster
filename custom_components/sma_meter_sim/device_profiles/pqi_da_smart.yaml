name: A. Eberle PQI-DA smart (Schnellblock 10 ms)
protocol: modbus
default_interval_ms: 100
word_swap: false
notes: >
  Adressen aus der offiziellen Modbus-Datenpunktliste (IL_PQI-DA-smart_Modbus_DE,
  a-eberle.de). Verwendet wird der kompakte Block ab Adresse 100 - das ist die
  schnelle Klasse (Halbperioden-/10-ms-Werte, gedacht fuer Istwert-Rueckfuehrung).
  Alles liegt in einem einzigen zusammenhaengenden Lesevorgang von 104 Registern
  (Adresse 102..142), das haelt die Zykluszeit klein.

  Register: Holding (input_register: false) - so liefert das Geraet die Daten.

  Adresse 138 (P_ges) wird als Gesamt-Wirkleistung verwendet. Die Liste
  bezeichnet sie als Grundschwingungs-Gesamtwirkleistung; laut Ruecksprache
  passt sie fuer diesen Zweck. Soll stattdessen aus den Straengen summiert
  werden, einfach die Zeile mit Adresse 138 auskommentieren - die Integration
  bildet die Summe dann selbst aus L1..L3.

  Zu pruefen beim ersten Lauf:
   - Vorzeichen: das Geraet liefert P vorzeichenbehaftet. Positiv muss Bezug aus
     dem Netz sein; zeigt der Zaehler es andersherum, im Dialog den Schalter
     "Vorzeichen umkehren" setzen.
   - Adressbasis: liefert der Scan Werte um 1 Register verschoben, alle Adressen
     um 1 korrigieren (0- vs. 1-basierte Zaehlung).

  Alternative langsamere Klasse mit Strang-Scheinleistung: l1_p 1946, l1_q 1948,
  l1_s 1950, l2_p 1952, l2_q 1954, l2_s 1956, l3_p 1958 usw.

registers:
  # Frequenz und Spannungen
  - {key: frequency, address: 102, dtype: float32, input_register: false}
  - {key: voltage, phase: l1, address: 104, dtype: float32, input_register: false}
  - {key: voltage, phase: l2, address: 106, dtype: float32, input_register: false}
  - {key: voltage, phase: l3, address: 108, dtype: float32, input_register: false}
  # Straenge
  - {key: current, phase: l1, address: 118, dtype: float32, input_register: false}
  - {key: current, phase: l2, address: 120, dtype: float32, input_register: false}
  - {key: current, phase: l3, address: 122, dtype: float32, input_register: false}
  # Leistungen je Strang (vorzeichenbehaftet)
  - {key: p, phase: l1, address: 126, dtype: float32, input_register: false}
  - {key: q, phase: l1, address: 128, dtype: float32, input_register: false}
  - {key: p, phase: l2, address: 130, dtype: float32, input_register: false}
  - {key: q, phase: l2, address: 132, dtype: float32, input_register: false}
  - {key: p, phase: l3, address: 134, dtype: float32, input_register: false}
  - {key: q, phase: l3, address: 136, dtype: float32, input_register: false}
  # Gesamtwerte
  - {key: p, address: 138, dtype: float32, input_register: false}
  - {key: q, address: 140, dtype: float32, input_register: false}
